<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Vivek Dev - 3D Haunted Puzzle</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
  color: white;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
}

#info {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  text-align: center;
  width: 90%;
  pointer-events: none;
  text-shadow: 0 2px 5px #000;
}

#title {
  font-size: 22px;
  font-weight: bold;
}

#status {
  margin-top: 8px;
  font-size: 15px;
}

#crosshair {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 5;
  font-size: 25px;
  pointer-events: none;
}

#joystick {
  position: fixed;
  left: 25px;
  bottom: 30px;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  border: 2px solid rgba(255,255,255,0.3);
  z-index: 20;
}

#stick {
  position: absolute;
  width: 58px;
  height: 58px;
  left: 36px;
  top: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.35);
  border: 2px solid rgba(255,255,255,0.6);
}

#lookArea {
  position: fixed;
  right: 0;
  top: 0;
  width: 65%;
  height: 70%;
  z-index: 15;
}

#action {
  position: fixed;
  right: 25px;
  bottom: 40px;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.5);
  background: rgba(100,100,100,0.3);
  color: white;
  font-size: 16px;
  font-weight: bold;
  z-index: 20;
}

#message {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 85%;
  max-width: 420px;
  padding: 25px;
  background: rgba(0,0,0,0.9);
  border: 2px solid #777;
  border-radius: 15px;
  text-align: center;
  z-index: 50;
  display: none;
}

#message h2 {
  margin-top: 0;
}

#start {
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  background: #222;
  color: white;
  font-size: 17px;
}

@media (min-width: 800px) {
  #joystick,
  #lookArea,
  #action {
    opacity: 0.75;
  }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="info">
  <div id="title">🎮 VIVEK DEV — HAUNTED ROOM</div>
  <div id="status">Find the door and solve the puzzle</div>
</div>

<div id="crosshair">+</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="lookArea"></div>

<button id="action">E<br>ACTION</button>

<div id="message">
  <h2 id="messageTitle">👻 Haunted Room</h2>
  <p id="messageText">
    Find the secret code and escape!
  </p>
  <button id="start">START GAME</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { PointerLockControls } from
"three/addons/controls/PointerLockControls.js";

/* =========================
   BASIC SETUP
========================= */

const game = document.getElementById("game");
const statusText = document.getElementById("status");
const message = document.getElementById("message");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");
const startButton = document.getElementById("start");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020205);

scene.fog = new THREE.FogExp2(
  0x020205,
  0.045
);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0, 1.7, 7);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled = true;

game.appendChild(renderer.domElement);


/* =========================
   LIGHTS
========================= */

const ambient = new THREE.AmbientLight(
  0x222233,
  0.35
);

scene.add(ambient);


/* Flashlight */

const flashlight = new THREE.SpotLight(
  0xffffff,
  5,
  25,
  Math.PI / 7,
  0.5,
  1
);

flashlight.position.set(0, 1.7, 0);

flashlight.castShadow = true;

camera.add(flashlight);

scene.add(camera);


/* Red spooky light */

const redLight = new THREE.PointLight(
  0xff0000,
  3,
  12
);

redLight.position.set(0, 3, -13);

scene.add(redLight);


/* =========================
   MATERIALS
========================= */

const wallMat = new THREE.MeshStandardMaterial({
  color: 0x202020
});

const floorMat = new THREE.MeshStandardMaterial({
  color: 0x111111
});

const doorMat = new THREE.MeshStandardMaterial({
  color: 0x321010
});

const goldMat = new THREE.MeshStandardMaterial({
  color: 0xaa7711,
  metalness: 0.7,
  roughness: 0.3
});


/* =========================
   FLOOR
========================= */

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  floorMat
);

floor.rotation.x = -Math.PI / 2;

floor.receiveShadow = true;

scene.add(floor);


/* =========================
   WALL FUNCTION
========================= */

function createWall(
  x,
  y,
  z,
  sx,
  sy,
  sz
) {

  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(sx, sy, sz),
    wallMat
  );

  wall.position.set(x, y, z);

  wall.castShadow = true;
  wall.receiveShadow = true;

  scene.add(wall);

  return wall;
}


/* Room */

createWall(0, 3, -15, 30, 6, 0.5);
createWall(-15, 3, 0, 0.5, 6, 30);
createWall(15, 3, 0, 0.5, 6, 30);
createWall(0, 6, 0, 30, 0.5, 30);


/* =========================
   DOOR
========================= */

const door = new THREE.Mesh(
  new THREE.BoxGeometry(4, 5, 0.5),
  doorMat
);

door.position.set(
  0,
  2.5,
  -14.7
);

door.castShadow = true;

scene.add(door);


/* Door handle */

const handle = new THREE.Mesh(
  new THREE.SphereGeometry(0.15, 16, 16),
  goldMat
);

handle.position.set(
  1.2,
  2.4,
  -14.35
);

scene.add(handle);


/* =========================
   CHEST
========================= */

const chest = new THREE.Mesh(
  new THREE.BoxGeometry(2, 1, 1.3),
  goldMat
);

chest.position.set(
  -6,
  0.5,
  -7
);

chest.castShadow = true;

scene.add(chest);


/* Chest lock */

const lock = new THREE.Mesh(
  new THREE.BoxGeometry(
    0.3,
    0.4,
    0.1
  ),
  new THREE.MeshStandardMaterial({
    color: 0x111111
  })
);

lock.position.set(
  -6,
  0.5,
  -6.3
);

scene.add(lock);


/* =========================
   CANDLES
========================= */

function createCandle(x, z) {

  const candle = new THREE.Mesh(
    new THREE.CylinderGeometry(
      0.12,
      0.12,
      0.8,
      12
    ),
    new THREE.MeshStandardMaterial({
      color: 0xeeeecc
    })
  );

  candle.position.set(
    x,
    0.4,
    z
  );

  scene.add(candle);

  const light = new THREE.PointLight(
    0xffaa44,
    1.5,
    5
  );

  light.position.set(
    x,
    1,
    z
  );

  scene.add(light);
}

createCandle(-6, -7);
createCandle(6, -5);
createCandle(-5, 4);


/* =========================
   PUZZLE
========================= */

let chances = 3;
let puzzleSolved = false;

const SECRET_CODE = "007";

function showPuzzle() {

  const answer = prompt(
    "🔐 SECRET PUZZLE\n\n" +
    "Door code क्या है?\n\n" +
    "Hint: 0 + 0 + 7 = ?\n\n" +
    "3 digits डालें:"
  );

  if (answer === SECRET_CODE) {

    puzzleSolved = true;

    door.material.color.set(0x064d20);

    statusText.innerText =
      "🟢 Door unlocked! Escape!";

    messageTitle.innerText =
      "🎉 YOU ESCAPED!";

    messageText.innerText =
      "Congratulations Vivek Dev!";

    message.style.display = "block";

  } else {

    chances--;

    if (chances <= 0) {

      statusText.innerText =
        "❌ Game Over";

      messageTitle.innerText =
        "GAME OVER";

      messageText.innerText =
        "तीनों chances खत्म हो गए।";

      message.style.display = "block";

    } else {

      statusText.innerText =
        "❌ Wrong code | Chances: " +
        chances;
    }
  }
}


/* =========================
   ACTION BUTTON
========================= */

function action() {

  if (puzzleSolved) return;

  const distance =
    camera.position.distanceTo(door.position);

  if (distance < 5) {

    showPuzzle();

  } else {

    statusText.innerText =
      "🚪 Door के पास जाकर ACTION दबाएँ";
  }
}

document
  .getElementById("action")
  .addEventListener(
    "touchstart",
    (e) => {
      e.preventDefault();
      action();
    }
  );

document
  .getElementById("action")
  .addEventListener(
    "click",
    action
  );


/* =========================
   KEYBOARD
========================= */

const keys = {
  w: false,
  a: false,
  s: false,
  d: false
};

window.addEventListener(
  "keydown",
  e => {

    const key =
      e.key.toLowerCase();

    if (key in keys)
      keys[key] = true;

    if (key === "e")
      action();
  }
);

window.addEventListener(
  "keyup",
  e => {

    const key =
      e.key.toLowerCase();

    if (key in keys)
      keys[key] = false;
  }
);


/* =========================
   MOBILE JOYSTICK
========================= */

const joystick =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");

let joystickActive = false;

let joyX = 0;
let joyY = 0;

let joystickId = null;

function updateJoystick(x, y) {

  const rect =
    joystick.getBoundingClientRect();

  const centerX =
    rect.left + rect.width / 2;

  const centerY =
    rect.top + rect.height / 2;

  let dx = x - centerX;
  let dy = y - centerY;

  const max =
    rect.width / 2 - 30;

  const distance =
    Math.sqrt(dx * dx + dy * dy);

  if (distance > max) {

    dx =
      dx / distance * max;

    dy =
      dy / distance * max;
  }

  stick.style.transform =
    `translate(${dx}px, ${dy}px)`;

  joyX = dx / max;
  joyY = dy / max;
}

joystick.addEventListener(
  "touchstart",
  e => {

    e.preventDefault();

    joystickActive = true;

    joystickId =
      e.changedTouches[0].identifier;

    const t =
      e.changedTouches[0];

    updateJoystick(
      t.clientX,
      t.clientY
    );
  },
  { passive: false }
);

joystick.addEventListener(
  "touchmove",
  e => {

    if (!joystickActive)
      return;

    e.preventDefault();

    for (const t of e.changedTouches) {

      if (
        t.identifier === joystickId
      ) {

        updateJoystick(
          t.clientX,
          t.clientY
        );
      }
    }
  },
  { passive: false }
);

function resetJoystick() {

  joystickActive = false;

  joystickId = null;

  joyX = 0;
  joyY = 0;

  stick.style.transform =
    "translate(0px, 0px)";
}

joystick.addEventListener(
  "touchend",
  resetJoystick
);

joystick.addEventListener(
  "touchcancel",
  resetJoystick
);


/* =========================
   TOUCH CAMERA
========================= */

const lookArea =
  document.getElementById("lookArea");

let lookActive = false;
let lastX = 0;
let lastY = 0;

lookArea.addEventListener(
  "touchstart",
  e => {

    if (!e.touches.length)
      return;

    const t = e.touches[0];

    lookActive = true;

    lastX = t.clientX;
    lastY = t.clientY;
  },
  { passive: false }
);

lookArea.addEventListener(
  "touchmove",
  e => {

    if (!lookActive)
      return;

    e.preventDefault();

    const t = e.touches[0];

    const dx =
      t.clientX - lastX;

    const dy =
      t.clientY - lastY;

    lastX = t.clientX;
    lastY = t.clientY;

    const sensitivity = 0.004;

    camera.rotation.y -=
      dx * sensitivity;

    camera.rotation.x -=
      dy * sensitivity;

    camera.rotation.x =
      Math.max(
        -1.4,
        Math.min(
          1.4,
          camera.rotation.x
        )
      );
  },
  { passive: false }
);

lookArea.addEventListener(
  "touchend",
  () => {
    lookActive = false;
  }
);


/* =========================
   MOVEMENT
========================= */

const velocity =
  new THREE.Vector3();

const direction =
  new THREE.Vector3();

const forward =
  new THREE.Vector3();

const right =
  new THREE.Vector3();

function movePlayer() {

  let forwardInput = 0;
  let sideInput = 0;

  /* Keyboard */

  if (keys.w)
    forwardInput += 1;

  if (keys.s)
    forwardInput -= 1;

  if (keys.d)
    sideInput += 1;

  if (keys.a)
    sideInput -= 1;

  /* Joystick */

  forwardInput += -joyY;
  sideInput += joyX;

  direction.set(
    sideInput,
    0,
    forwardInput
  );

  if (direction.length() > 1)
    direction.normalize();

  const speed = 0.09;

  camera.getWorldDirection(forward);

  forward.y = 0;

  forward.normalize();

  right.crossVectors(
    forward,
    camera.up
  );

  right.normalize();

  velocity.set(0, 0, 0);

  velocity.addScaledVector(
    forward,
    direction.z * speed
  );

  velocity.addScaledVector(
    right,
    direction.x * speed
  );

  camera.position.add(velocity);

  /* Room boundaries */

  camera.position.x =
    Math.max(
      -13.5,
      Math.min(
        13.5,
        camera.position.x
      )
    );

  camera.position.z =
    Math.max(
      -13.5,
      Math.min(
        13.5,
        camera.position.z
      )
    );

  camera.position.y = 1.7;
}


/* =========================
   START BUTTON
========================= */

startButton.addEventListener(
  "click",
  () => {

    message.style.display =
      "none";

    camera.position.set(
      0,
      1.7,
      7
    );
  }
);


/* =========================
   DESKTOP POINTER LOCK
========================= */

const controls =
  new PointerLockControls(
    camera,
    document.body
  );

renderer.domElement.addEventListener(
  "click",
  () => {

    if (window.innerWidth > 800) {

      controls.lock();
    }
  }
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);


/* =========================
   GAME LOOP
========================= */

const clock =
  new THREE.Clock();

function animate() {

  requestAnimationFrame(
    animate
  );

  movePlayer();

  /* Candle flicker */

  scene.traverse(
    object => {

      if (
        object.isPointLight &&
        object !== redLight
      ) {

        object.intensity =
          1.2 +
          Math.random() * 0.5;
      }
    }
  );

  renderer.render(
    scene,
    camera
  );
}

animate();


/* =========================
   START MESSAGE
========================= */

message.style.display = "block";

</script>

</body>
</html>
